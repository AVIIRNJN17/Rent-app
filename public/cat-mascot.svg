<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1C18" />
      <stop offset="50%" stop-color="#141311" />
      <stop offset="100%" stop-color="#0A0908" />
    </linearGradient>

    <!-- Royal Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="30%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <!-- Warm Inner Ear Gradient -->
    <linearGradient id="earInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>

    <!-- Cat Fur Soft Gradient -->
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F4EFE6" />
      <stop offset="100%" stop-color="#E2D7C5" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Outer Golden Greek Meander / Geometric Ring Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="12 8" opacity="0.4" />

  <!-- Cat Shadow -->
  <ellipse cx="256" cy="410" rx="140" ry="24" fill="#000000" opacity="0.4" filter="blur(8px)" />

  <!-- Cat Body -->
  <path d="M160 410 C160 330 200 310 256 310 C312 310 352 330 352 410 Z" fill="url(#furGrad)" />

  <!-- Ears with Gold Accents -->
  <!-- Left Ear -->
  <path d="M168 220 L132 110 C130 102 142 96 150 104 L212 165 Z" fill="url(#furGrad)" />
  <path d="M168 200 L146 126 C144 120 152 116 156 122 L198 165 Z" fill="url(#earInnerGrad)" opacity="0.9" />

  <!-- Right Ear -->
  <path d="M344 220 L380 110 C382 102 370 96 362 104 L300 165 Z" fill="url(#furGrad)" />
  <path d="M344 200 L366 126 C368 120 360 116 356 122 L314 165 Z" fill="url(#earInnerGrad)" opacity="0.9" />

  <!-- Cat Head -->
  <circle cx="256" cy="235" r="105" fill="url(#furGrad)" filter="url(#shadow)" />

  <!-- Royal Laurel Crown on Cat Head -->
  <g transform="translate(256, 142) scale(0.9)">
    <path d="M-55 10 C-35 -15 -15 -10 0 0 C15 -10 35 -15 55 10 C45 22 30 12 0 16 C-30 12 -45 22 -55 10 Z" fill="url(#goldGrad)" />
    <!-- Crown Tri-peaks -->
    <polygon points="-30,6 -20,-22 -10,4" fill="url(#goldGrad)" />
    <polygon points="-12,4 0,-34 12,4" fill="url(#goldGrad)" />
    <polygon points="10,4 20,-22 30,6" fill="url(#goldGrad)" />
    <!-- Crown Gem -->
    <circle cx="0" cy="-14" r="5" fill="#FFE27A" />
    <circle cx="-20" cy="-8" r="3.5" fill="#FFE27A" />
    <circle cx="20" cy="-8" r="3.5" fill="#FFE27A" />
  </g>

  <!-- Big Friendly Cat Eyes -->
  <ellipse cx="215" cy="225" rx="15" ry="20" fill="#241E15" />
  <ellipse cx="297" cy="225" rx="15" ry="20" fill="#241E15" />

  <!-- Golden Iris Sparkle -->
  <circle cx="212" cy="220" r="6" fill="#FFF8DC" />
  <circle cx="218" cy="229" r="2.5" fill="#FFF8DC" />
  <circle cx="294" cy="220" r="6" fill="#FFF8DC" />
  <circle cx="300" cy="229" r="2.5" fill="#FFF8DC" />

  <!-- Sweet Pink/Gold Nose -->
  <polygon points="256,248 248,238 264,238" fill="#D4AF37" rx="2" />

  <!-- Smiling Mouth -->
  <path d="M248 250 Q240 262 232 254" fill="none" stroke="#241E15" stroke-width="3" stroke-linecap="round" />
  <path d="M264 250 Q272 262 280 254" fill="none" stroke="#241E15" stroke-width="3" stroke-linecap="round" />

  <!-- Cheerful Blush -->
  <ellipse cx="192" cy="242" rx="12" ry="7" fill="#E5C158" opacity="0.35" />
  <ellipse cx="320" cy="242" rx="12" ry="7" fill="#E5C158" opacity="0.35" />

  <!-- Golden Whiskers -->
  <line x1="185" y1="236" x2="135" y2="230" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="185" y1="244" x2="130" y2="246" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="185" y1="252" x2="138" y2="262" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <line x1="327" y1="236" x2="377" y2="230" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="327" y1="244" x2="382" y2="246" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <line x1="327" y1="252" x2="374" y2="262" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <!-- Royal Golden Collar with ₹ Rupee Medallion -->
  <path d="M195 320 Q256 345 317 320" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
  <!-- Medallion Drop -->
  <circle cx="256" cy="358" r="28" fill="url(#goldGrad)" stroke="#FFEAA7" stroke-width="3" filter="url(#goldGlow)" />
  <circle cx="256" cy="358" r="22" fill="#181613" />
  <text x="256" y="367" font-family="'Cinzel', serif" font-size="24" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">₹</text>

  <!-- Paws peeking over edge -->
  <ellipse cx="210" cy="386" rx="22" ry="16" fill="url(#furGrad)" stroke="url(#goldGrad)" stroke-width="2" />
  <ellipse cx="302" cy="386" rx="22" ry="16" fill="url(#furGrad)" stroke="url(#goldGrad)" stroke-width="2" />
</svg>
